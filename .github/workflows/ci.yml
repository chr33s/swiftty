name: Swift checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    # The package and native test bundles require macOS 27 and Swift 6.4.
    runs-on: namespace-profile-mac
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release, internal-checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-macos
        with:
          test-tools: 'true'
      - name: Test
        shell: bash
        run: |
          case '${{ matrix.configuration }}' in
            debug) Scripts/test-native.sh ;;
            release) Scripts/test-native.sh -c release ;;
            internal-checks) Scripts/test-native.sh -Xswiftc -DSWIFTTY_INTERNAL_CHECKS ;;
          esac
      - name: Build production products
        if: matrix.configuration == 'release'
        run: swift build -c release
      - name: Check formatting and documentation
        if: matrix.configuration == 'debug'
        run: Scripts/format-swift.sh check
      - name: Check unchecked Sendable documentation
        if: matrix.configuration == 'debug'
        run: Scripts/check-unchecked-sendable.sh
  frontends:
    runs-on: namespace-profile-mac
    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'generic/platform=iOS Simulator'
          - 'generic/platform=macOS,variant=Mac Catalyst'
          - 'generic/platform=visionOS Simulator'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-macos
      - name: Build frontend
        run: >-
          xcodebuild -scheme SwifttyMobile -configuration Release
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO build
