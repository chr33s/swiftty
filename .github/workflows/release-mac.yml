name: Release Swiftty.app

# Builds Swiftty.app (the unsandboxed native macOS terminal with the
# SwiftMux agent), signs it with Developer ID, notarizes it and publishes
# it as a GitHub release. The roaming clients ship through Xcode Cloud and
# TestFlight instead (Apps/ci_scripts).
#
# A pushed tag v<major>[.<minor>[.<patch>]] (e.g. v0.3 or v0.3.1) releases
# that tag; other v* tags do not start a release. A manual run creates a
# mac-v<version>-<build> prerelease at the selected commit, even when it
# is started from a tag.
#
# Runs on the GitHub-hosted xcode-27 image (arm64 macOS 27); setup-macos
# selects the newest Xcode on the image and requires Xcode 27 / Swift 6.4.
# Signing uses a temporary keychain, removed even when a later step fails.
#   vars.DEVELOPER_ID_IDENTITY  e.g. "Developer ID Application: Name (TEAMID)"
#   secrets.MACOS_CERTIFICATE_P12       base64 certificate AND private key (.p12)
#   secrets.MACOS_CERTIFICATE_PASSWORD  password for that .p12
#   secrets.NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY
#                               App Store Connect API key (.p8 contents),
#                               used by Scripts/notarize.sh

on:
  push:
    # Only the versions package-swiftmux.sh accepts.
    tags: ['v[0-9]+', 'v[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString
        required: true
        default: '0.2'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-macos
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
        run: |
          : "${MACOS_CERTIFICATE_P12:?set the MACOS_CERTIFICATE_P12 repository secret}"
          : "${IDENTITY:?set the DEVELOPER_ID_IDENTITY repository variable}"
          umask 077
          certificate="$RUNNER_TEMP/swiftty-signing.p12"
          keychain="$RUNNER_TEMP/swiftty-signing.keychain-db"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          keychain_password=$(openssl rand -base64 32)
          original_keychains=()
          security list-keychains -d user > "$RUNNER_TEMP/swiftty-keychains.txt"
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*\"(.*)\"[[:space:]]*$ ]]; then
              original_keychains+=("${BASH_REMATCH[1]}")
            else
              echo "cannot parse the user keychain search list" >&2; exit 1
            fi
          done < "$RUNNER_TEMP/swiftty-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -f pkcs12 -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" ${original_keychains[@]+"${original_keychains[@]}"}
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$IDENTITY" > /dev/null
      - name: Package and sign
        env:
          IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
          SWIFTTY_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          SWIFTTY_BUILD: ${{ github.run_number }}
        run: |
          [ -n "$IDENTITY" ] || { echo "set the DEVELOPER_ID_IDENTITY repository variable" >&2; exit 64; }
          SWIFTTY_VERSION=${SWIFTTY_VERSION#v} Scripts/package-swiftmux.sh "$IDENTITY" .build/package
      - name: Notarize and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: Scripts/release-mac-github.sh .build/package/Swiftty.app
      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/swiftty-signing.keychain-db"
          rm -f "$RUNNER_TEMP/swiftty-signing.p12"
          rm -f "$RUNNER_TEMP/swiftty-keychains.txt"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
