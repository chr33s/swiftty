[tools]
# Swift comes from Xcode, as on CI: swift.org toolchains bundle their own
# Swift Testing runtime, which conflicts with Xcode 27.2's XCTest and
# stops the native test host from discovering tests.
tmux = "3.7c" # integration tests; latest available tmux-builds release
zig = "0.17.0" # builds upstream ghostty-bench for comparison
"github:sharkdp/hyperfine" = "2.0.0" # upstream now publishes native arm64 binaries

[env]
# swift.org toolchains need the macOS SDK from Xcode / CLT to link.
SDKROOT = "{{exec(command='xcrun --sdk macosx --show-sdk-path')}}"

[tasks.build]
description = "Build SwifttyCore and the app (debug)"
run = "swift build"

[tasks.restart]
description = "Restart SwifttyMux agent (launchctl)"
run = "launchctl kickstart -k gui/$(id -u)/com.chr33s.swiftty.swiftmux"

[tasks.release]
description = "Build everything (release)"
run = "swift build -c release"

[tasks.test]
description = "Run unit + integration tests (native test bundle host)"
# Plain `swift test` drains the main queue on a bare CFRunLoopRun; AppKit's
# event thread stops it when window-server events arrive, ending the AppKit
# bundles early. The native host runs NSApplication instead.
run = "Scripts/test-native.sh"

[tasks.test-native]
description = "Run the full suite with the native test bundle host"
run = "Scripts/test-native.sh"

[tasks.bench]
description = "Run microbenchmarks on a release build"
run = "swift run -c release swiftty-bench"

[tasks.app]
description = "Launch the swiftty macOS app"
run = "swift run -c release swiftty"

[tasks.package-swiftmux]
description = "Assemble and sign Swiftty.app with the SwiftMux agent: mise run package-swiftmux [identity]"
run = "Scripts/package-swiftmux.sh"

[tasks.install]
description = "Install Swiftty.app, register the SwiftMux agent and install the iOS/iPadOS app on USB-connected devices; --roaming adds swifttyd, --no-devices skips devices: mise run install [options]"
run = "Scripts/install.sh"

[tasks.install-ios]
description = "Install the iOS/iPadOS app on iPhones and iPads connected by USB: mise run install-ios --team TEAM [--device UDID]"
run = "Scripts/install-ios.sh"

[tasks.uninstall]
description = "Remove Swiftty.app, the SwiftMux agent and swifttyd: mise run uninstall [--purge] [-y]"
run = "Scripts/uninstall.sh"

[tasks.bench-swiftmux]
description = "SwiftMux throughput, latency, CPU, memory and GPU measurements"
run = "swift run -c release swiftmux-bench"

[tasks.unicode]
description = "Regenerate Unicode width tables"
run = "Scripts/update-unicode-tables.sh"

[tasks.graphemes]
description = "Regenerate grapheme property tables and conformance test data from a UCD directory"
run = "Scripts/update-grapheme-tables.sh"

[tasks.format]
description = "Format sources"
run = "Scripts/format-swift.sh"

[tasks.lint]
description = "Lint sources (swift-format, strict)"
run = "Scripts/format-swift.sh check"

[tasks.compare]
description = "Compare against upstream ghostty-bench: mise run compare <ghostty-src> <corpus-dir>"
depends = ["release"]
run = "Scripts/compare-ghostty.sh"

[tasks.format-check]
description = "Check Swift formatting and documentation"
run = "Scripts/format-swift.sh check"

[tasks.test-internal]
description = "Run tests with storage and terminal invariant checks"
run = "Scripts/test-native.sh -Xswiftc -DSWIFTTY_INTERNAL_CHECKS"

[tasks.bench-storage]
description = "Measure storage operation scaling"
run = "swift run -c release swiftty-bench --only storage"
