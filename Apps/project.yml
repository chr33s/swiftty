# XcodeGen spec for the roaming SSH client apps (spec.roaming.md §11).
#
# Each app target is a thin wrapper around package products; all shared
# logic lives in the `RoamingApp` and `CompanionModel` SwiftPM targets.
# Generate with Scripts/build-platforms.sh (the .xcodeproj is not
# committed). `swifttyd` is a SwiftPM executable and is not built here.
#
# Universal purchase: MobileClient, CatalystClient, VisionClient and
# TVClient share one bundle ID, so they are the iOS, macOS (Mac Catalyst),
# visionOS and tvOS platforms of a single App Store Connect app and a
# single TestFlight entry; the watch app's ID extends it. The native macOS
# terminal (Swiftty.app, Scripts/package-swiftmux.sh) is SwiftPM-built,
# unsandboxed and distributed separately with Developer ID.
#
# Universal Links are configured at generation time: set
# SWIFTTY_LINK_DOMAINS (comma-separated) before running xcodegen and the
# preGenCommand writes Config/Generated/ (spec.inbox.md §4.4).
name: Swiftty

options:
  # Writes Config/Generated/AttentionLinks.plist and the per-target
  # entitlements from SWIFTTY_LINK_DOMAINS (no associated domains when
  # unset). Runs from this directory.
  preGenCommand: ../Scripts/configure-links.sh
  # Builds the local package's code with arm64e too, so pointer
  # authentication (ENABLE_ENHANCED_SECURITY below) covers RoamingApp and
  # the rest of the linked package code, not just the thin app targets.
  postGenCommand: ../Scripts/configure-arm64e-packages.sh Swiftty.xcodeproj
  bundleIdPrefix: dev.chr33s.swiftty
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    tvOS: "27.0"
    visionOS: "27.0"
    watchOS: "27.0"

packages:
  Swiftty:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    TVOS_DEPLOYMENT_TARGET: "27.0"
    XROS_DEPLOYMENT_TARGET: "27.0"
    WATCHOS_DEPLOYMENT_TARGET: "27.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Enhanced Security (spec.roaming.md §2.5): pointer authentication
    # (arm64e), security compiler warnings, typed allocators and libc++
    # hardening for every target. The runtime protections are the
    # com.apple.security.hardened-process entitlements in
    # Apps/<Target>/<Target>.entitlements (iOS, Catalyst, visionOS only).
    ENABLE_ENHANCED_SECURITY: YES
    # Extract the app targets' localizable literals into their String
    # Catalogs (Apps/WatchCompanion/Localizable.xcstrings) on build.
    SWIFT_EMIT_LOC_STRINGS: YES
    # These apps declare no App Intents. Skip the extractor instead of
    # invoking it without an AppIntents.framework dependency.
    LM_SKIP_METADATA_EXTRACTION: YES
    # With iOSPackagesShouldBuildARM64e (postGenCommand) Xcode builds the
    # package products for arm64 only on the simulator, so an app slice
    # for x86_64 cannot import them. macOS 27 runs only on Apple silicon,
    # so the Intel simulator slice is never used.
    "EXCLUDED_ARCHS[sdk=*simulator*]": x86_64
    # Automatic signing for Xcode Cloud archives (Apps/ci_scripts). XcodeGen
    # substitutes SWIFTTY_TEAM_ID at generation time; when it is unset the
    # literal reference expands to an empty team and local unsigned builds
    # are unaffected.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${SWIFTTY_TEAM_ID}
    # Resources/Assets.xcassets (iOS and macOS images). watchOS has its own
    # Apps/WatchCompanion/Assets.xcassets: actool flags a watchOS icon slot
    # as an unassigned child when compiling for macOS (Catalyst). tvOS and
    # visionOS need layered icons: Apps/TVClient/Assets.xcassets and
    # Apps/VisionClient/Assets.xcassets, generated from icon.svg by
    # Scripts/gen-platform-icons.swift.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Shared Info.plist keys for direct clients. No UIBackgroundModes: the
# clients never claim background execution (spec §9).
directClientSettings: &directClientSettings
  # Covers Nearby Macs (Bonjour browsing for _swiftty._tcp, declared in
  # Config/AttentionLinks.plist's NSBonjourServices) and SSH/QUIC
  # connections to Macs on the local network (spec.connection-setup.md D5).
  INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
    Find and connect to your Mac to access terminal workspaces on your local
    network.
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  INFOPLIST_KEY_CFBundleDisplayName: Swiftty
  INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # Attention deep links (spec.inbox.md §4.4): registers the `swiftty`
  # URL scheme, merged into the generated Info.plist, with no Universal
  # Link domains. Targets that support Universal Links instead use
  # Config/Generated/AttentionLinks.plist (the domain list for
  # AttentionLink) and Config/Generated/<Target>.entitlements (the
  # target's own Apps/<Target>/<Target>.entitlements keys plus, only when
  # SWIFTTY_LINK_DOMAINS is set, com.apple.developer.associated-domains),
  # both written by the preGenCommand.
  INFOPLIST_FILE: Config/AttentionLinks.plist

targets:
  # iOS/iPadOS full client and iPhone side of the watch companion bridge.
  MobileClient:
    type: application
    platform: iOS
    sources:
      # Entitlements are merged into Config/Generated/ by the
      # preGenCommand, not bundled as a resource.
      - path: MobileClient
        excludes: ["*.entitlements"]
      - ../Resources/Assets.xcassets
    scheme: {}
    dependencies:
      - package: Swiftty
        product: RoamingApp
      - package: Swiftty
        product: CompanionModel
      # Paired watch companion, embedded in Watch/ (spec §2.1).
      - target: WatchCompanion
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Watch
    settings:
      base:
        <<: *directClientSettings
        INFOPLIST_FILE: Config/Generated/AttentionLinks.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.chr33s.swiftty
        # Match the Objective-C class metadata ABI used by our SwiftPM
        # dependencies (see Package.swift); keep arm64e authentication on.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -no-sign-class-ro"
        # Scan Mac Code; the only target that uses the camera.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Scan the connection code displayed by your Mac.
        CODE_SIGN_ENTITLEMENTS: Config/Generated/MobileClient.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  # UIKit-derived full remote client, built only as a Mac Catalyst
  # destination. No local PTY; never the swifttyd agent.
  CatalystClient:
    type: application
    platform: iOS
    sources:
      - path: CatalystClient
        excludes: ["*.entitlements"]
      - ../Resources/Assets.xcassets
    # Scheme defined under `schemes:` below so the archive can be named
    # "Swiftty" rather than after the target.
    dependencies:
      - package: Swiftty
        product: RoamingApp
    settings:
      base:
        <<: *directClientSettings
        INFOPLIST_FILE: Config/Generated/AttentionLinks.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.chr33s.swiftty
        # Swiftty.app is the native Mac terminal; Finder shows the bundle's
        # file name, so this one installs as "Swiftty Remote.app".
        PRODUCT_NAME: Swiftty Remote
        INFOPLIST_KEY_CFBundleDisplayName: Swiftty Remote
        SUPPORTS_MACCATALYST: YES
        # Mac Catalyst only: it shares the universal-purchase ID with
        # MobileClient, so an iOS build of this target could replace the
        # real iOS app (with its watch app) in App Store Connect.
        SUPPORTED_PLATFORMS: macosx
        # Default archives and generic macOS destinations must also use
        # UIKit's Catalyst SDK variant rather than native AppKit.
        SDKROOT: macosx
        SDK_VARIANT: iosmac
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2,6"
        CODE_SIGN_ENTITLEMENTS: Config/Generated/CatalystClient.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Mac Catalyst links with a hard-coded
        # `-L$(TOOLCHAIN_DIR)/usr/lib/swift/maccatalyst`. When the Xcode 27
        # IDE has the Metal toolchain installed it puts that toolchain first,
        # so TOOLCHAIN_DIR resolves to Metal.xctoolchain, which has no Swift
        # libraries, and every link step warns "Search path ... not found".
        # TOOLCHAINS alone does not change the resolved TOOLCHAIN_DIR in
        # Xcode 27.2. Pin the directory used by the linker as well; this
        # target compiles no Metal shaders.
        TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        TOOLCHAIN_DIR: "$(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain"
        # Pointer authentication off for this target only: Xcode builds
        # package products as arm64e only for the iOS-family SDKs it covers
        # with iOSPackagesShouldBuildARM64e, not for Mac Catalyst, so an arm64e
        # build cannot import RoamingApp ("Unable to resolve module
        # dependency"). The rest of Enhanced Security still applies. Lift
        # this when Xcode builds packages as arm64e here
        # (spec.roaming.md §2.5).
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO

  # Windowed visionOS full remote client.
  VisionClient:
    type: application
    platform: visionOS
    sources:
      - path: VisionClient
        excludes: ["*.entitlements"]
    scheme: {}
    dependencies:
      - package: Swiftty
        product: RoamingApp
    settings:
      base:
        <<: *directClientSettings
        INFOPLIST_FILE: Config/Generated/AttentionLinks.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.chr33s.swiftty
        CODE_SIGN_ENTITLEMENTS: Config/Generated/VisionClient.entitlements
        TARGETED_DEVICE_FAMILY: "7"

  # Focus-first tvOS SSH/roaming client; no SFTP. swiftty:// links only:
  # no associated domains (tvOS has no browser to hand https links over).
  TVClient:
    type: application
    platform: tvOS
    sources: [TVClient]
    scheme: {}
    dependencies:
      - package: Swiftty
        product: RoamingApp
    settings:
      base:
        <<: *directClientSettings
        PRODUCT_BUNDLE_IDENTIFIER: dev.chr33s.swiftty
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # Pointer authentication off for this target only: Xcode builds
        # package products as arm64e only for the iOS-family SDKs it covers
        # with iOSPackagesShouldBuildARM64e, not for tvOS, so an arm64e
        # build cannot import RoamingApp ("Unable to resolve module
        # dependency"). The rest of Enhanced Security still applies. Lift
        # this when Xcode builds packages as arm64e here
        # (spec.roaming.md §2.5).
        ENABLE_POINTER_AUTHENTICATION: NO
        ENABLE_HARDWARE_CHECKED_POINTER_ARITHMETIC_SLICE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  # Read-only watch companion. Links ONLY CompanionModel and the
  # Foundation-only MuxNavigation (redacted attention summaries and
  # handoff requests; its XPC transport compiles only on macOS): no
  # Swiftty, NIO/SSH, QUIC, SFTP or PTY code may reach the watch
  # (spec §2.2). No URL scheme: the watch never opens panes itself.
  WatchCompanion:
    type: application
    platform: watchOS
    sources: [WatchCompanion]
    scheme: {}
    dependencies:
      - package: Swiftty
        product: CompanionModel
      - package: Swiftty
        product: MuxNavigation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chr33s.swiftty.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Swiftty
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.chr33s.swiftty
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
schemes:
  # Same as the generated target scheme, plus an archive name: Xcode names
  # archives after the scheme, so without this the Organizer shows
  # "CatalystClient" instead of "Swiftty".
  CatalystClient:
    build:
      targets:
        CatalystClient: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      customArchiveName: Swiftty
